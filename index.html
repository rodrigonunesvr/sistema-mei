<html lang="pt-BR">
<head>

<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F6F8;--surface:#FFFFFF;--text:#1B2733;--muted:#44566A;--line:#D5DEE5;
  --primary:#0B6E63;--on-primary:#FFFFFF;--accent:#0B6E63;--navy:#1F3A5F;
  --ok:#1B7A47;--okbg:#E3F4EA;--bad:#B3261E;--badbg:#FCE8E6;--warn:#7A4B00;--warnbg:#FFF3D6;--focus:#2E7DD1;
  --shadow:0 1px 2px rgba(20,40,60,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--bg:#0E1620;--surface:#16212D;--text:#E8EEF4;--muted:#A9B7C6;--line:#2B3A49;
    --primary:#5CD1C1;--on-primary:#06201C;--accent:#5CD1C1;--navy:#223B5E;
    --ok:#7BDDA3;--okbg:#143324;--bad:#FF9A92;--badbg:#3B1A18;--warn:#F5CF84;--warnbg:#3A2E12;--focus:#7DB6F0;--shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1620;--surface:#16212D;--text:#E8EEF4;--muted:#A9B7C6;--line:#2B3A49;
  --primary:#5CD1C1;--on-primary:#06201C;--accent:#5CD1C1;--navy:#223B5E;
  --ok:#7BDDA3;--okbg:#143324;--bad:#FF9A92;--badbg:#3B1A18;--warn:#F5CF84;--warnbg:#3A2E12;--focus:#7DB6F0;--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:24px;line-height:1.2;margin:0}
h2{font-size:20px;line-height:1.25;margin:0 0 12px}
h3{font-size:16px;margin:0}
.top{display:flex;flex-direction:column;gap:2px;margin:4px 0 14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card>h3{margin-bottom:8px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;word-break:break-word}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;border-radius:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;text-decoration:none}
.btn.sec{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.full{width:100%}
.mini{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--primary);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:12px}
.f .hint{font-weight:400;font-size:13px;color:var(--muted)}
.in{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:16px;font-weight:400}
textarea.in{min-height:90px;resize:vertical}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:12px;font-weight:700;background:var(--surface)}
.seg input:checked+span{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.li{display:flex;gap:8px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.li-main{flex:1;min-width:0;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer;min-height:64px;color:inherit}
.li-main .t{display:flex;flex-direction:column;min-width:0}
.li-main .t b{overflow-wrap:anywhere}
.li-main .s{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.li .mini{align-self:center;margin-right:10px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;white-space:nowrap}
.b-pago{background:var(--okbg);color:var(--ok)}.b-atrasado{background:var(--badbg);color:var(--bad)}
.b-7dias{background:var(--warnbg);color:var(--warn)}.b-pendente,.b-noprazo{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.help{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0 0 14px}
.help summary,.faq summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px;cursor:pointer;font-weight:700}
.help summary::-webkit-details-marker,.faq summary::-webkit-details-marker{display:none}
.help .q{flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-size:14px}
.help .hb,.faq .fb{padding:0 14px 14px;color:var(--muted)}
.help .hb p{margin:0 0 8px}.help .hb ol{margin:0;padding-left:20px}
.faq{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.faq summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--accent)}
.faq[open] summary::after{content:"–"}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:120px;font-size:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:15;min-height:56px;padding:0 22px;border-radius:28px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.navin a,.navin button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:6px 2px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer}
.navin svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navin [aria-current="page"]{color:var(--accent)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet:focus{outline:none}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.frm[data-tipo="receita"] .only-despesa,.frm[data-tipo="despesa"] .only-receita,.frm[data-st="pago"] .only-pend{display:none}
.frm .newcli{display:none}.frm[data-newcli="1"] .newcli{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%}
.toast[hidden]{display:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.scroll-x{overflow-x:auto}
.rank{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.hbar{height:8px;border-radius:4px;background:var(--bg);margin-top:4px;overflow:hidden}.hbar>i{display:block;height:100%;background:var(--primary)}
.doc{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:18px}
.doc h2{color:#1F3A5F;margin-bottom:4px}
.doc .tbl th,.doc .tbl td{border-bottom:1px solid #ddd}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.chk{min-height:44px;min-width:92px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.chk[aria-pressed="true"]{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
#lock{align-items:center;background:var(--bg);z-index:80}
.frm[data-rep="none"] .only-rep{display:none}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.mini.tall{min-height:56px;text-align:left;line-height:1.3}
.tbtn{margin-left:10px;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:700;cursor:pointer}
.toast{z-index:120}
#gate{align-items:center;background:var(--bg);z-index:90}
.lic-foot{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
  nav.bottom,.fab,.toast{display:none!important}
}
</style>
</head>
<body>
<div class="app" id="view" aria-live="polite"></div>
<nav class="bottom" aria-label="Menu principal"><div class="navin" id="nav"></div></nav>
<div class="ov" id="ov" hidden></div>
<div class="ov" id="lock" hidden></div>
<div class="ov" id="gate" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>

<script src="licenca-config.js"></script>
<script>
(function(){
'use strict';

/* ============================== constantes ============================== */
var MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var M3=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var CATS=['Materiais e insumos','Transporte e combustível','Marketing e anúncios','Equipamentos e ferramentas','Software e assinaturas','Internet e telefone','Aluguel / espaço','Impostos (DAS)','Taxas de pagamento','Cursos e capacitação','Outros'];
var FORMAS=['Pix','Dinheiro','Cartão de crédito','Cartão de débito','Boleto','Transferência','Outro'];
var ORIGENS=['Indicação','Instagram','WhatsApp','Google','Facebook','Site','Outro'];
var ROUTES={painel:'Painel',lancamentos:'Lançamentos',clientes:'Clientes',servicos:'Serviços',orcamento:'Orçamentos e recibos',precificacao:'Precificação',obrigacoes:'Obrigações do MEI',ajuda:'Ajuda e glossário',config:'Configurações'};
var KEY='meiapp:v1',THEME_KEY='meiapp:theme';
var CHECKS=['CNPJ/CCMEI com dados atualizados','Nota fiscal emitida para clientes que são empresas (PJ)','Notas de compras e vendas guardadas (5 anos)','Conta bancária separada da pessoal (recomendado)','Reserva para 13º, férias e imprevistos em dia','Faturamento do ano conferido com o limite do MEI'];

/* ============================== utilitários ============================== */
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var brl=function(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
function num(v){if(typeof v==='number')return isFinite(v)?v:0;var s=String(v==null?'':v).trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?n:0}
var toIn=function(n){return (n||n===0)?String(n).replace('.',','):''};
var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var todayISO=function(){return iso(new Date())};
var fdate=function(s){return s?s.split('-').reverse().join('/'):''};
var addDays=function(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x};
var dayDiff=function(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000)};
function nextBiz(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return x}
var byName=function(a,b){return a.nome.localeCompare(b.nome,'pt-BR')};
var $=function(id){return document.getElementById(id)};

/* ============================== estado ============================== */
var S=null,memOnly=false,LIC=null,deferredInstall=null;
function blank(){var t=new Date();return {v:1,demo:false,config:{nome:'Meu negócio MEI',ano:t.getFullYear(),limite:81000,das:86.05,meta:3000,alerta:80,cnpj:'',contato:'',pix:'',r13:10,rEm:10,rRe:10},clientes:[],servicos:[],lanc:[],orcs:[],lastBackup:0,pin:'',welcomed:false,obrig:{das:{},rel:{},dasn:false,check:{}},pre:{renda:3000,fixos:400,reserva:15,dias:20,horasDia:5,taxa:3,margem:30}}}
function migrate(o){var b=blank();o.config=Object.assign(b.config,o.config||{});o.pre=Object.assign(b.pre,o.pre||{});o.orcs=o.orcs||[];o.lastBackup=o.lastBackup||0;o.pin=o.pin||'';if(o.welcomed===undefined)o.welcomed=true;o.obrig=o.obrig||b.obrig;return o}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1)return migrate(o)}}catch(e){memOnly=true}return null}
function save(){if(LIC&&S)S.licId=LIC.id;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}

function demo(){
  var t=new Date(),cm=t.getMonth()+1,td=t.getDate(),s=blank();
  s.demo=true;s.config.nome='Estúdio Lumi Fotografia';s.config.meta=4500;s.pre.renda=3500;s.pre.fixos=450;s.config.pix='chave-pix@exemplo.com';s.lastBackup=Date.now();s.welcomed=true;
  s.clientes=[['c1','Maria Silva','(00) 90000-0001','maria@exemplo.com','Teresópolis','Instagram'],['c2','João Pereira','(00) 90000-0002','joao@exemplo.com','Petrópolis','Indicação'],['c3','Padaria Bom Grão','(00) 90000-0003','contato@bomgrao.exemplo.com','Teresópolis','Google'],['c4','Camila Duarte','(00) 90000-0004','camila@exemplo.com','Nova Friburgo','Instagram'],['c5','Loja Flor de Lis','(00) 90000-0005','flordelis@exemplo.com','Teresópolis','WhatsApp'],['c6','Rafael Costa','(00) 90000-0006','rafael@exemplo.com','Rio de Janeiro','Indicação'],['c7','Fernanda Lima','(00) 90000-0007','fernanda@exemplo.com','Teresópolis','Facebook'],['c8','Studio Pilates Corpo & Alma','(00) 90000-0008','studio@exemplo.com','Teresópolis','Indicação']].map(function(a){return {id:a[0],nome:a[1],tel:a[2],email:a[3],cidade:a[4],origem:a[5],obs:''}});
  s.servicos=[['s1','Ensaio individual','Ensaios',350,3,40],['s2','Ensaio de família','Ensaios',550,4,60],['s3','Cobertura de evento (4h)','Eventos',1200,8,120],['s4','Fotos de produto (10 fotos)','Comercial',450,3,25],['s5','Book profissional','Ensaios',480,3,45],['s6','Edição extra (por foto)','Pós-produção',15,0.25,0],['s7','Álbum impresso 20x30','Produtos',380,1,210]].map(function(a){return {id:a[0],nome:a[1],cat:a[2],preco:a[3],horas:a[4],custo:a[5]}});
  var price={};s.servicos.forEach(function(x){price[x.id]=x.preco});
  var pj={c3:1,c5:1,c8:1},cyc=['s1','s4','s2','s5','s1','s7','s4','s2'];
  var cliFor={s1:['c1','c4','c7','c6'],s2:['c2','c1','c7'],s4:['c5','c3'],s5:['c6','c4'],s7:['c2','c1'],s3:['c8','c3']};
  var formas=['Pix','Pix','Cartão de crédito','Dinheiro','Pix','Transferência'],days=[3,8,13,19,24,28];
  var y=s.config.ano;
  function D(m,d){return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.max(1,d)).padStart(2,'0')}
  function add(o){o.id=uid();s.lanc.push(o)}
  for(var m=1;m<=cm;m++){
    var n=m<cm?6:3;
    for(var j=0;j<n;j++){
      var dd=days[j];if(m===cm)dd=Math.min(dd,td);
      var sv=cyc[(m*3+j)%8],lst=cliFor[sv],cl=lst[(m+j)%lst.length];
      add({data:D(m,dd),tipo:'receita',clienteId:cl,servicoId:sv,cat:'',desc:'',valor:price[sv],forma:formas[(m+j)%6],status:'pago',venc:'',nf:pj[cl]?'Sim':'Não'});
    }
    if(m<cm&&(m===3||m===6||m===9)){var c2=m===6?'c3':'c8';add({data:D(m,16),tipo:'receita',clienteId:c2,servicoId:'s3',cat:'',desc:'Evento',valor:1200,forma:'Transferência',status:'pago',venc:'',nf:'Sim'})}
    if(m<cm&&(m===2||m===5||m===8)){add({data:D(m,21),tipo:'receita',clienteId:'c1',servicoId:'s6',cat:'',desc:'10 fotos extras',valor:150,forma:'Pix',status:'pago',venc:'',nf:'Não'})}
    add({data:D(m,Math.min(5,m===cm?td:5)),tipo:'despesa',clienteId:'',servicoId:'',cat:'Software e assinaturas',desc:'Assinatura de edição de fotos',valor:89.9,forma:'Cartão de crédito',status:'pago',venc:'',nf:''});
    if(m<cm){
      add({data:D(m,10),tipo:'despesa',clienteId:'',servicoId:'',cat:'Internet e telefone',desc:'Plano internet + celular',valor:139.9,forma:'Cartão de débito',status:'pago',venc:'',nf:''});
      add({data:D(m,18),tipo:'despesa',clienteId:'',servicoId:'',cat:'Materiais e insumos',desc:'Papel fotográfico e pendrives',valor:60+(m*13)%120,forma:'Cartão de débito',status:'pago',venc:'',nf:''});
      add({data:D(m,12),tipo:'despesa',clienteId:'',servicoId:'',cat:'Transporte e combustível',desc:'Deslocamentos para ensaios',valor:90+(m*37)%110,forma:'Pix',status:'pago',venc:'',nf:''});
      if(m%2===1)add({data:D(m,7),tipo:'despesa',clienteId:'',servicoId:'',cat:'Marketing e anúncios',desc:'Impulsionamento Instagram',valor:100,forma:'Cartão de crédito',status:'pago',venc:'',nf:''});
      if(m>=2)add({data:D(m,20),tipo:'despesa',clienteId:'',servicoId:'',cat:'Impostos (DAS)',desc:'DAS competência '+MES[m-2],valor:86.05,forma:'Boleto',status:'pago',venc:'',nf:''});
    }
  }
  var T=iso(t);
  add({data:T,tipo:'receita',clienteId:'c2',servicoId:'s2',cat:'',desc:'',valor:550,forma:'Cartão de crédito',status:'pendente',venc:iso(addDays(t,-6)),nf:'Não'});

var UN=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
var DEZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
var CENT=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];

function extInt(n){if(n===0)return 'zero';var mi=Math.floor(n/1e6),mil=Math.floor((n%1e6)/1000),r=n%1000,parts=[];
  if(mi)parts.push({t:mi===1?'um milhão':ext3(mi)+' milhões',v:mi*1e6});
  if(mil)parts.push({t:mil===1?'mil':ext3(mil)+' mil',v:mil*1000});
  if(r)parts.push({t:ext3(r),v:r});
  var out=parts[0].t;for(var i=1;i<parts.length;i++){var v=parts[i].v,last=i===parts.length-1;out+=(last&&(v<100||v%100===0)?' e ':' ')+parts[i].t}return out}
function extenso(v){v=Math.round((Number(v)||0)*100)/100;if(v<=0)return '';if(v>=1e9)return '';var r=Math.floor(v),c=Math.round((v-r)*100),p=[];
  if(r)p.push(extInt(r)+(r===1?' real':(r%1e6===0&&r>=1e6?' de reais':' reais')));
  if(c)p.push(extInt(c)+(c===1?' centavo':' centavos'));return p.join(' e ')}

/* ---------- Lançamentos ---------- */
R.lancamentos=function(){
  var h=head('Lançamentos','Cada dinheiro que entra ou sai')+help('O que são os lançamentos?','É o seu caderno financeiro: cada vez que você recebe (receita) ou paga (despesa) algo, anote aqui. Todo o resto do app (Painel, clientes, obrigações) é calculado a partir destas anotações.',['Toque em “+ Novo lançamento” (ou use a Venda rápida).','Escolha Receita ou Despesa e digite o valor.','Se ainda não recebeu/pagou, marque Pendente e informe o vencimento.','Para conta fixa ou venda parcelada, use o campo “Repetir”.']);
  h+='<div class="row" style="margin-bottom:12px"><button class="btn grow" data-a="new-l">+ Novo lançamento</button>'+(S.lanc.length?'<button class="btn sec" data-a="repeat-last">Repetir último</button>':'')+'</div>'+quickChips();
  h+='<div class="card"><div class="stack"><div class="row"><div class="grow">'+monthSel('lmes',UI.lm,true)+'</div><div style="width:104px">'+yearSel()+'</div></div>'+'<div class="muted small" style="margin-bottom:-4px">Tipo</div>'
    +'<div class="seg" role="radiogroup" aria-label="Filtrar tipo" style="margin:0">'+['todos|Todos','receita|Receitas','despesa|Despesas'].map(function(o){var p=o.split('|');return '<label><input type="radio" name="ftipo" value="'+p[0]+'" data-on="ftipo"'+(UI.tipo===p[0]?' checked':'')+'><span>'+p[1]+'</span></label>'}).join('')+'</div>'
    +'<div class="muted small" style="margin-bottom:-4px">Situação</div><div class="seg" role="radiogroup" aria-label="Filtrar status" style="margin:0">'+['todos|Todos','pendente|Pendentes','pago|Pagos'].map(function(o){var p=o.split('|');return '<label><input type="radio" name="fst" value="'+p[0]+'" data-on="fst"'+(UI.st===p[0]?' checked':'')+'><span>'+p[1]+'</span></label>'}).join('')+'</div></div></div>';
  h+='<div id="lanc-list">'+lancList()+'</div>';
  return h;
};
function lancList(){
  var a=S.lanc.filter(function(l){return (UI.lm===0?inYear(l):inMonth(l,UI.lm))&&(UI.tipo==='todos'||l.tipo===UI.tipo)&&(UI.st==='todos'||l.status===UI.st)});
  a.sort(function(x,y){return y.data.localeCompare(x.data)});
  var r=sum(a.filter(function(l){return l.tipo==='receita'})),d=sum(a.filter(function(l){return l.tipo==='despesa'}));
  var h='<div class="card row" style="justify-content:space-between"><span><span class="muted small">Receitas</span><br><b class="pos">'+brl(r)+'</b></span><span><span class="muted small">Despesas</span><br><b class="neg">'+brl(d)+'</b></span><span><span class="muted small">Saldo</span><br><b>'+brl(r-d)+'</b></span></div>';
  if(!a.length)return h+'<div class="empty">Nenhum lançamento neste filtro.<br>Toque em “+ Novo lançamento” para anotar o primeiro.</div>';
  return h+a.map(function(l){
    var s=situ(l),c=cli(l.clienteId),sv=svc(l.servicoId),isR=l.tipo==='receita';
    var title=l.desc||(isR?(sv?sv.nome:'Receita'):(l.cat||'Despesa')),sub=fdate(l.data)+(isR&&c?' · '+c.nome:'')+(isR&&sv&&l.desc?' · '+sv.nome:'')+(l.forma?' · '+l.forma:'');
    return '<div class="li"><button class="li-main" data-a="edit-l" data-id="'+l.id+'"><span class="t"><b>'+esc(title)+'</b><span class="muted small">'+esc(sub)+'</span></span><span class="s"><b class="'+(isR?'pos':'neg')+'">'+(isR?'+':'−')+' '+brl(l.valor)+'</b><span class="badge b-'+s+'">'+SITU_TXT[s]+'</span></span></button>'+(l.status==='pendente'?'<button class="mini" data-a="pay" data-id="'+l.id+'" aria-label="Marcar como '+(isR?'recebido':'pago')+'">'+(isR?'Recebi':'Paguei')+'</button>':'')+'</div>'
  }).join('');
}
function optsCli(sel){return '<option value="">— sem cliente —</option>'+S.clientes.slice().sort(byName).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.nome)+'</option>'}).join('')+'<option value="__new__">+ Novo cliente…</option>'}
function optsSvc(sel){return '<option value="">— escolha o serviço —</option>'+S.servicos.slice().sort(byName).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.nome)+'</option>'}).join('')}
function optsList(arr,sel){return arr.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function lancForm(l){
  var isN=!l.id;
  return '<form class="frm" data-form="lanc" data-id="'+(l.id||'')+'" data-tipo="'+l.tipo+'" data-st="'+l.status+'" data-rep="none"><h2>'+(isN?'Novo lançamento':'Editar lançamento')+'</h2>'
  +'<div class="seg" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="tipo" value="receita" data-on="ltipo"'+(l.tipo==='receita'?' checked':'')+'><span>Receita (entrou)</span></label><label><input type="radio" name="tipo" value="despesa" data-on="ltipo"'+(l.tipo==='despesa'?' checked':'')+'><span>Despesa (saiu)</span></label></div>'
  +'<label class="f">Valor (R$)<input class="in" name="valor" inputmode="decimal" placeholder="0,00" value="'+toIn(l.valor)+'" required></label>'
  +'<label class="f">Data<input class="in" type="date" name="data" value="'+l.data+'" required></label>'
  +'<div class="only-receita"><label class="f">Cliente<select class="in" name="clienteId" data-on="lcli">'+optsCli(l.clienteId)+'</select></label>'
  +'<label class="f newcli">Nome do novo cliente<input class="in" name="novoCliente" placeholder="Ex.: Ana Souza"></label>'
  +'<label class="f">Serviço<select class="in" name="servicoId" data-on="lsvc">'+optsSvc(l.servicoId)+'</select><span class="hint">Ao escolher, o valor é preenchido pelo preço do serviço.</span></label></div>'
  +'<div class="only-despesa"><label class="f">Categoria da despesa<select class="in" name="cat">'+optsList(CATS,l.cat||'Materiais e insumos')+'</select></label></div>'
  +'<label class="f">Descrição (opcional)<input class="in" name="desc" value="'+esc(l.desc)+'" placeholder="Ex.: Ensaio no parque"></label>'
  +'<label class="f">Forma de pagamento<select class="in" name="forma">'+optsList(FORMAS,l.forma||'Pix')+'</select></label>'
  +'<div class="seg" role="radiogroup" aria-label="Situação"><label><input type="radio" name="status" value="pago" data-on="lst"'+(l.status==='pago'?' checked':'')+'><span>Já foi pago</span></label><label><input type="radio" name="status" value="pendente" data-on="lst"'+(l.status==='pendente'?' checked':'')+'><span>Pendente</span></label></div>'
  +'<label class="f only-pend">Vencimento / previsão<input class="in" type="date" name="venc" value="'+(l.venc||'')+'"><span class="hint">O app avisa quando estiver atrasado.</span></label>'
  +'<label class="f only-receita">Nota fiscal emitida?<select class="in" name="nf">'+optsList(['Não','Sim'],l.nf||'Não')+'</select><span class="hint">Usado no relatório mensal de receitas.</span></label>'
  +(isN?'<label class="f">Repetir<select class="in" name="rep" data-on="lrep"><option value="none">Não repetir</option><option value="mensal">Todo mês (conta fixa, assinatura)</option><option value="parcelado">Parcelado (divide o valor)</option></select></label><label class="f only-rep">Quantas vezes?<input class="in" name="repn" inputmode="numeric" value="3"><span class="hint">As próximas ficam como pendentes, uma por mês. No parcelado, o valor acima é o total e é dividido entre as parcelas.</span></label>':'')
  +'<div class="stack"><button class="btn full" type="submit">Salvar</button><button class="btn sec full" type="button" data-a="close">Cancelar</button>'+(isN?'':'<button class="btn danger full" type="button" data-a="del-l" data-id="'+l.id+'">'+(UI.armed==='l'+l.id?'Toque de novo para excluir':'Excluir lançamento')+'</button>')+'</div></form>';
}

/* ---------- Clientes ---------- */
function lastBuy(id){var d='';recs().forEach(function(l){if(l.clienteId===id&&l.data>d)d=l.data});return d}
R.clientes=function(){
  return head('Clientes','Quem compra de você')+help('O que é a tela de clientes?','É a sua agenda de clientes. Além de guardar o contato, ela mostra sozinha quanto cada cliente já rendeu no ano, quanto ainda deve e quem está parado há muito tempo sem comprar (uma chance de vender de novo).',['Toque em “+ Novo cliente” e escreva o nome e o contato.','Use a busca ou o filtro “Parados 60+ dias”.','Toque no cliente para editar ou copiar uma mensagem de retorno.'])
   +'<button class="btn full" data-a="new-c" style="margin-bottom:12px">+ Novo cliente</button><div class="card"><div class="stack"><label class="f" style="margin:0">Buscar cliente<input class="in" type="search" data-on="busca" value="'+esc(UI.busca)+'" placeholder="Digite o nome"></label>'
   +'<div class="seg" role="radiogroup" aria-label="Filtro" style="margin:0"><label><input type="radio" name="cpar" value="0" data-on="cpar"'+(UI.parados?'':' checked')+'><span>Todos</span></label><label><input type="radio" name="cpar" value="1" data-on="cpar"'+(UI.parados?' checked':'')+'><span>Parados 60+ dias</span></label></div></div></div><div id="cli-list">'+cliList()+'</div>';
};
function cliList(){
  var q=UI.busca.trim().toLowerCase(),t=todayISO();
  var a=S.clientes.map(function(c){var lb=lastBuy(c.id);return {c:c,dias:lb?dayDiff(t,lb):null}}).filter(function(x){return (!q||x.c.nome.toLowerCase().indexOf(q)>-1)&&(!UI.parados||(x.dias!==null&&x.dias>=60))}).sort(function(x,y){return UI.parados?(y.dias-x.dias):byName(x.c,y.c)});
  if(!a.length)return '<div class="empty">'+(UI.parados?'Nenhum cliente parado há 60 dias ou mais.':(S.clientes.length?'Nenhum cliente encontrado.':'Nenhum cliente ainda.<br>Toque em “+ Novo cliente” para cadastrar.'))+'</div>';
  return a.map(function(x){var c=x.c,st=clientStats(c.id);return '<div class="li"><button class="li-main" data-a="edit-c" data-id="'+c.id+'"><span class="t"><b>'+esc(c.nome)+'</b><span class="muted small">'+esc([c.cidade,c.origem].filter(Boolean).join(' · ')||'Sem detalhes')+'</span></span><span class="s"><b>'+brl(st.fat)+'</b>'+(st.dev>0?'<span class="badge b-7dias">deve '+brl(st.dev)+'</span>':(x.dias!==null&&x.dias>=60?'<span class="badge b-atrasado">'+x.dias+' dias parado</span>':'<span class="muted small">'+st.n+' no ano</span>'))+'</span></button></div>'}).join('');
}
function cliForm(c){
  var isN=!c.id;
  return '<form data-form="cli" data-id="'+(c.id||'')+'"><h2>'+(isN?'Novo cliente':'Editar cliente')+'</h2>'
  +'<label class="f">Nome<input class="in" name="nome" value="'+esc(c.nome)+'" required></label>'
  +'<label class="f">Telefone / contato<input class="in" name="tel" type="tel" value="'+esc(c.tel)+'" placeholder="(00) 90000-0000"></label>'
  +'<label class="f">E-mail<input class="in" name="email" type="email" value="'+esc(c.email)+'"></label>'
  +'<label class="f">Cidade<input class="in" name="cidade" value="'+esc(c.cidade)+'"></label>'
  +'<label class="f">Como chegou até você<select class="in" name="origem"><option value="">—</option>'+optsList(ORIGENS,c.origem)+'</select></label>'
  +'<label class="f">Observações<textarea class="in" name="obs">'+esc(c.obs)+'</textarea></label>'
  +'<div class="stack"><button class="btn full" type="submit">Salvar</button>'+(isN?'':'<button class="btn sec full" type="button" data-a="reativar" data-id="'+c.id+'">Copiar mensagem de retorno</button>')+'<button class="btn sec full" type="button" data-a="close">Cancelar</button>'+(isN?'':'<button class="btn danger full" type="button" data-a="del-c" data-id="'+c.id+'">'+(UI.armed==='c'+c.id?'Toque de novo para excluir':'Excluir cliente')+'</button>')+'</div></form>';
}

/* ---------- Serviços ---------- */
R.servicos=function(){
  var h=head('Serviços','O que você vende')+help('O que é o catálogo de serviços?','É a lista do que você vende, com preço, tempo e custo de materiais. O app calcula o lucro de cada serviço, o lucro por hora e quanto cada um já deixou de lucro no ano, para você saber quais valem mais a pena.',['Toque em “+ Novo serviço” ou carregue serviços da sua área.','Informe preço, horas gastas e custo de materiais.','Veja margem, lucro por hora e lucro do ano na própria lista.']);
  var a=S.servicos.slice().sort(byName);
  h+='<div class="stack" style="margin-bottom:12px"><button class="btn full" data-a="new-s">+ Novo serviço</button><button class="btn sec full" data-a="niches">Carregar serviços da minha área</button></div>';
  h+=a.length?a.map(function(s){var l=num(s.preco)-num(s.custo),mg=s.preco?l/s.preco:0,lh=s.horas?l/s.horas:0,st=svcStats(s.id),la=st.fat-num(s.custo)*st.n;return '<div class="li"><button class="li-main" data-a="edit-s" data-id="'+s.id+'"><span class="t"><b>'+esc(s.nome)+'</b><span class="muted small">Lucro '+brl(l)+' · margem '+Math.round(mg*100)+'% · '+brl(lh)+'/hora</span></span><span class="s"><b>'+brl(s.preco)+'</b><span class="muted small">'+st.n+'× · lucro ano '+brl(la)+'</span></span></button></div>'}).join(''):'<div class="empty">Nenhum serviço ainda.<br>Toque em “+ Novo serviço” ou carregue os da sua área.</div>';
  return h;
};
function svcPrev(f){var p=num(f.preco.value),h=num(f.horas.value),c=num(f.custo.value),l=p-c;return '<b>Lucro:</b> '+brl(l)+' · <b>Margem:</b> '+(p?Math.round(l/p*100)+'%':'—')+' · <b>Lucro por hora:</b> '+(h?brl(l/h):'—')}
function svcForm(s){
  var isN=!s.id;
  return '<form data-form="svc" data-id="'+(s.id||'')+'"><h2>'+(isN?'Novo serviço':'Editar serviço')+'</h2>'
  +'<label class="f">Nome do serviço<input class="in" name="nome" value="'+esc(s.nome)+'" required></label>'
  +'<label class="f">Categoria (opcional)<input class="in" name="cat" value="'+esc(s.cat)+'"></label>'
  +'<label class="f">Preço (R$)<input class="in" name="preco" inputmode="decimal" value="'+toIn(s.preco)+'" data-on="svcprev" required></label>'
  +'<label class="f">Tempo gasto (horas)<input class="in" name="horas" inputmode="decimal" value="'+toIn(s.horas)+'" data-on="svcprev"><span class="hint">Inclua preparação e entrega.</span></label>'
  +'<label class="f">Custo de materiais (R$)<input class="in" name="custo" inputmode="decimal" value="'+toIn(s.custo)+'" data-on="svcprev"><span class="hint">O que você gasta para fazer este serviço uma vez.</span></label>'
  +'<div class="card" id="svc-prev" style="background:var(--bg)">'+'Preencha o preço para ver o lucro.'+'</div>'
  +'<div class="stack"><button class="btn full" type="submit">Salvar</button><button class="btn sec full" type="button" data-a="close">Cancelar</button>'+(isN?'':'<button class="btn danger full" type="button" data-a="del-s" data-id="'+s.id+'">'+(UI.armed==='s'+s.id?'Toque de novo para excluir':'Excluir serviço')+'</button>')+'</div></form>';
}

/* ---------- Orçamentos e recibos ---------- */
function orcTotals(){var o=UI.orc,sub=0;var rows=o.itens.map(function(it){var s=svc(it.sid),q=num(it.qtd)||0,u=s?num(s.preco):0,t=q*u;sub+=t;return {s:s,q:q,u:u,t:t}});var d=sub*(num(o.desc)/100);return {rows:rows,sub:sub,d:d,tot:sub-d}}
function orcPreview(){
  var o=UI.orc,c=S.config,T=orcTotals(),cl=cli(o.cliente),val=new Date();val.setDate(val.getDate()+(num(o.val)||0));
  var rows=T.rows.filter(function(r){return r.s}).map(function(r){return '<tr><td>'+esc(r.s.nome)+'</td><td class="r">'+r.q+'</td><td class="r">'+brl(r.u)+'</td><td class="r">'+brl(r.t)+'</td></tr>'}).join('')||'<tr><td colspan="4" style="color:#666">Adicione serviços acima.</td></tr>';
  return '<div class="doc" id="print-area"><h2>'+esc(c.nome)+'</h2><div style="color:#555;font-size:13px">'+esc([c.cnpj&&'CNPJ '+c.cnpj,c.contato].filter(Boolean).join(' · '))+'</div><hr style="border:0;border-top:1px solid #ccc;margin:10px 0">'
  +'<b>ORÇAMENTO'+(o.num?' Nº '+esc(o.num):'')+'</b><div style="font-size:14px">Cliente: '+esc(cl?cl.nome:'—')+'<br>Data: '+fdate(todayISO())+' · Válido até: '+fdate(iso(val))+'</div>'
  +'<div class="scroll-x"><table class="tbl" style="margin-top:10px"><thead><tr><th>Serviço</th><th class="r">Qtd</th><th class="r">Unit.</th><th class="r">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
  +'<div style="text-align:right;margin-top:8px;font-size:14px">Subtotal: '+brl(T.sub)+(T.d?'<br>Desconto ('+num(o.desc)+'%): − '+brl(T.d):'')+'<br><b style="font-size:18px">TOTAL: '+brl(T.tot)+'</b></div>'
  +(o.cond?'<p style="font-size:14px"><b>Pagamento:</b> '+esc(o.cond)+'</p>':'')+(o.prazo?'<p style="font-size:14px"><b>Prazo de execução:</b> '+esc(o.prazo)+'</p>':'')+(o.obs?'<p style="font-size:14px"><b>Observações:</b> '+esc(o.obs)+'</p>':'')+'</div>';
}
function recPreview(){
  var r=UI.rec,c=S.config,cl=cli(r.cliente),v=num(r.valor),ex=extenso(v);
  return '<div class="doc" id="print-area"><h2>'+esc(c.nome)+'</h2><div style="color:#555;font-size:13px">'+esc([c.cnpj&&'CNPJ '+c.cnpj,c.contato].filter(Boolean).join(' · '))+'</div><hr style="border:0;border-top:1px solid #ccc;margin:10px 0">'
  +'<b>RECIBO</b><p style="font-size:15px;line-height:1.6">Recebi de <b>'+esc(cl?cl.nome:'________')+'</b>'+(r.doc?' (CPF/CNPJ '+esc(r.doc)+')':'')+' a quantia de <b>'+brl(v)+'</b>'+(ex?' ('+esc(ex)+')':'')+(r.desc?', referente a '+esc(r.desc):'')+'. Forma de pagamento: '+esc(r.forma)+'.</p>'
  +'<p style="font-size:14px">'+esc(r.local||'')+(r.local?', ':'')+fdate(todayISO())+'</p><div style="margin-top:34px;text-align:center"><div style="border-top:1px solid #333;display:inline-block;min-width:220px;padding-top:4px">'+esc(c.nome)+'</div></div></div>';
}
function histView(){
  var a=S.orcs.slice().sort(function(x,y){return y.data.localeCompare(x.data)}),ap=a.filter(function(o){return o.status==='aprovado'}),vap=ap.reduce(function(s,o){return s+o.tot},0),tx=a.length?Math.round(ap.length/a.length*100):0;
  var h='<div class="kpis"><div class="kpi"><div class="l">Orçamentos salvos</div><div class="v">'+a.length+'</div></div><div class="kpi"><div class="l">Taxa de aprovação</div><div class="v">'+tx+'%</div><div class="small muted">'+ap.length+' aprovado'+(ap.length===1?'':'s')+'</div></div></div><div class="card"><b>Valor aprovado: '+brl(vap)+'</b></div>';
  if(!a.length)return h+'<div class="empty">Nenhum orçamento salvo.<br>Monte um orçamento e toque em “Salvar no histórico”.</div>';
  return h+a.map(function(o){var c=cli(o.cliente);return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+esc(c?c.nome:'Sem cliente')+'</b><b>'+brl(o.tot)+'</b></div><div class="small muted">'+fdate(o.data)+(o.num?' · nº '+esc(o.num):'')+'</div><div class="row" style="margin-top:8px;align-items:flex-end"><label class="f grow" style="margin:0">Status<select class="in" data-on="orcst" data-id="'+o.id+'">'+[['enviado','Enviado'],['aprovado','Aprovado'],['recusado','Recusado']].map(function(p){return '<option value="'+p[0]+'"'+(o.status===p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></label><button class="mini" data-a="orc-del" data-id="'+o.id+'">Excluir</button></div>'+(o.lancId?'<div class="small pos" style="margin-top:6px">Lançamento “a receber” criado.</div>':'')+'</div>'}).join('');
}
R.orcamento=function(){
  var h=head('Orçamentos e recibos','Documentos prontos para enviar')+help('Para que serve esta tela?','Monte um orçamento ou um recibo em segundos: o app puxa preços e clientes que você já cadastrou e calcula o total. Depois você copia o texto, imprime ou salva em PDF. No Histórico você acompanha quais orçamentos foram aprovados.',['Escolha o cliente e os serviços.','Confira a pré-visualização.','Copie o texto, imprima/salve em PDF ou salve no histórico.']);
  h+='<div class="seg" role="radiogroup" aria-label="Documento">'+[['orc','Orçamento'],['rec','Recibo'],['hist','Histórico']].map(function(p){return '<label><input type="radio" name="om" value="'+p[0]+'" data-on="omode"'+(UI.orcMode===p[0]?' checked':'')+'><span>'+p[1]+'</span></label>'}).join('')+'</div>';
  if(UI.orcMode==='hist')return h+histView();
  if(UI.orcMode==='orc'){

   +pf('renda','Quanto você quer ganhar por mês (líquido)? R$','Sua retirada: o “salário” que você quer.',p.renda)

   +pf('reserva','Reserva para 13º, férias e imprevistos (%)','MEI não tem 13º nem férias: separe uma parte da sua retirada.',p.reserva)

   +pf('taxa','Taxa média de maquininha/cartão (%)','Se só usa Pix, coloque 0.',p.taxa)+pf('margem','Margem de lucro desejada nos serviços (%)','Quanto a mais você quer ganhar além de cobrir custos.',p.margem)+'</div>';

function pf(k,l,hint,v){return '<label class="f">'+l+'<input class="in" inputmode="decimal" data-on="pre" data-k="'+k+'" value="'+toIn(v)+'">'+(hint?'<span class="hint">'+hint+'</span>':'')+'</label>'}
function preOut(){
  var ch=custoHora(),c=S.config,anual=ch.meta*12,lim=num(c.limite),pct=lim?anual/lim:0;
  var h='<div class="kpis"><div class="kpi"><div class="l">O valor da sua hora</div><div class="v pos">'+brl(ch.hora)+'</div></div><div class="kpi"><div class="l">Precisa faturar por mês</div><div class="v">'+brl(ch.meta)+'</div></div></div>';
  h+='<div class="card"><b>Por ano: '+brl(anual)+' ('+Math.round(pct*100)+'% do limite do MEI)</b><p class="muted small" style="margin:6px 0 0">'+(anual>lim?'Atenção: para ganhar o que deseja você precisaria faturar mais que o limite do MEI.':'Sua meta anual cabe dentro do limite do MEI.')+' O DAS ('+brl(c.das)+') já está incluído.</p></div>';
  h+='<div class="card"><h3>Passo 2 — Preço sugerido por serviço</h3><div class="muted small" style="margin-bottom:8px">Usa as horas e o custo de materiais cadastrados em Serviços.</div>';
  if(!S.servicos.length)h+='<div class="empty">Cadastre serviços na aba Serviços para ver os preços sugeridos.</div>';
  else h+=S.servicos.slice().sort(byName).map(function(s){var sg=Math.ceil(sugerido(s,ch)),ok=num(s.preco)>=sg;return '<div class="rank"><div style="flex:1;min-width:0"><b>'+esc(s.nome)+'</b><div class="small muted">Você cobra '+brl(s.preco)+' · sugerido '+brl(sg)+'</div><span class="badge '+(ok?'b-pago':'b-atrasado')+'">'+(ok?'Preço OK':'Abaixo do ideal')+'</span></div>'+(ok?'':'<button class="mini" data-a="usar-preco" data-id="'+s.id+'" aria-label="Usar preço sugerido para '+esc(s.nome)+'">Usar '+brl(sg)+'</button>')+'</div>'}).join('');
  return h+'</div><p class="muted small">Fórmula: (horas × valor da hora + materiais) × (1 + margem) ÷ (1 − taxa de pagamento), arredondado para cima. É uma sugestão de partida, não uma regra.</p>';
}

R.obrigacoes=function(){
  var c=S.config,y=c.ano,h=head('Obrigações do MEI','Calendário e checklist')+help('O que são as obrigações do MEI?','São os compromissos que o MEI precisa cumprir: pagar o DAS (a guia mensal de impostos), preencher o relatório mensal de receitas e entregar a declaração anual. Aqui você acompanha cada um e marca como feito.',['Veja o vencimento do mês e pague a guia no app oficial do MEI.','Marque “Pago” aqui para o app parar de avisar.','Marque o relatório mensal como preenchido.']);

  h+='<div class="card"><h3>1. DAS mensal</h3><div class="muted small">Vence todo dia 20. Se cair em fim de semana, passa para o próximo dia útil (feriados locais não são considerados). Valor: '+brl(c.das)+' (edite em Configurações).</div><div style="margin-top:6px">';
  for(var m=1;m<=12;m++){var k=y+'-'+String(m).padStart(2,'0'),due=nextBiz(new Date(y,m,20)),di=iso(due),pago=!!S.obrig.das[k],d=dayDiff(di,T),s=pago?'pago':(d<0?'atrasado':(d<=7?'7dias':'noprazo'));
    h+='<div class="sw"><div><b>'+MES[m-1]+'/'+y+'</b><div class="small muted">vence '+fdate(di)+' · <span class="badge b-'+s+'">'+(s==='noprazo'?'Em dia':SITU_TXT[s])+'</span></div></div><button class="chk" data-a="tg-das" data-id="'+k+'" aria-pressed="'+pago+'" aria-label="DAS de '+MES[m-1]+'">'+(pago?'Pago ✓':'Marcar pago')+'</button></div>'}
  h+='</div></div><div class="card"><h3>2. Relatório mensal de receitas brutas</h3><div class="muted small">Preencha até o dia 20 do mês seguinte e guarde junto das notas (5 anos). O app já soma os valores para você copiar.</div><div style="margin-top:6px">';
  var tot=0;
  for(m=1;m<=12;m++){var k2=y+'-'+String(m).padStart(2,'0'),rl=recs().filter(function(l){return inMonth(l,m)}),com=sum(rl.filter(function(l){return l.nf==='Sim'})),all=sum(rl);tot+=all;
    h+='<div class="sw"><div><b>'+MES[m-1]+'</b><div class="small muted">Com nota '+brl(com)+' · sem nota '+brl(all-com)+'<br>Total <b>'+brl(all)+'</b> · prazo '+fdate(iso(new Date(y,m,20)))+'</div></div><button class="chk" data-a="tg-rel" data-id="'+k2+'" aria-pressed="'+!!S.obrig.rel[k2]+'" aria-label="Relatório de '+MES[m-1]+'">'+(S.obrig.rel[k2]?'Feito ✓':'Marcar feito')+'</button></div>'}
  h+='</div></div><div class="card"><h3>3. Declaração anual (DASN-SIMEI)</h3><div class="muted small">Informa à Receita o faturamento do ano. Prazo até 31/05/'+(y+1)+'.</div><div class="sw"><div><b>Faturamento a declarar</b><div>'+brl(tot)+'</div></div><button class="chk" data-a="tg-dasn" aria-pressed="'+!!S.obrig.dasn+'">'+(S.obrig.dasn?'Entregue ✓':'Marcar entregue')+'</button></div></div>';
  h+='<div class="card"><h3>4. Checklist de boas práticas</h3>'+CHECKS.map(function(t,i){return '<div class="sw"><span>'+t+'</span><button class="chk" data-a="tg-chk" data-id="'+i+'" aria-pressed="'+!!S.obrig.check[i]+'" aria-label="'+esc(t)+'">'+(S.obrig.check[i]?'Sim ✓':'Não')+'</button></div>'}).join('')+'</div>';
  return h+'<p class="muted small">Aviso: este app é um organizador. Regras, valores e prazos podem mudar; confirme sempre no Portal do Empreendedor ou com um contador.</p>';
};

  cfg:function(t){var k=t.dataset.k,v=t.value;if(['nome','cnpj','contato','pix'].indexOf(k)>-1)S.config[k]=v;else if(k==='ano'){var a=parseInt(v,10);if(a>2000&&a<2100)S.config[k]=a}else S.config[k]=num(v);save()},

/* ============================== licença e início ============================== */
function b64u2buf(x){x=x.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';var b=atob(x),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function checkLicense(code){
  var cfg=window.MEI_LICENSE;
  if(!window.crypto||!crypto.subtle)return Promise.resolve({ok:false,why:'semsuporte'});
  var parts=String(code||'').replace(/\s+/g,'').split('.');
  if(parts.length!==3||parts[0]!=='MEI1')return Promise.resolve({ok:false,why:'formato'});
  return crypto.subtle.importKey('jwk',cfg.pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(key){
    return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u2buf(parts[2]),b64u2buf(parts[1])).then(function(ok){
      if(!ok)return {ok:false,why:'assinatura'};
      var pl=JSON.parse(new TextDecoder().decode(b64u2buf(parts[1])));
      if((cfg.revoked||[]).indexOf(pl.id)>-1)return {ok:false,why:'revogada',pl:pl};
      return {ok:true,pl:pl};
    });
  }).catch(function(){return {ok:false,why:'erro'}});
}
function showGate(msg){
  var cfg=window.MEI_LICENSE||{},g=$('gate');g.hidden=false;
  g.innerHTML='<div class="sheet" style="border-radius:18px;max-width:440px;margin:auto"><h2>Ativar seu acesso</h2><p class="muted">Cole abaixo o código que você recebeu após a compra. Ele é pessoal e traz o seu nome.</p><form data-form="gate"><label class="f">Código de acesso<textarea class="in" name="code" rows="4" placeholder="MEI1.…" required autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></label><div class="stack"><button class="btn full" type="submit">Ativar</button><button class="btn sec full" type="button" data-a="gate-paste">Colar da área de transferência</button></div></form><p class="small" id="gate-msg" role="status" style="min-height:20px;margin:10px 0 0">'+esc(msg||'')+'</p><p class="small muted" style="margin:0">'+(cfg.buy?'Ainda não comprou? '+esc(cfg.buy)+'<br>':'')+(cfg.support?'Dúvidas: '+esc(cfg.support):'')+'</p></div>';
}
function showRevoked(pl){
  S=load()||blank();var cfg=window.MEI_LICENSE||{},g=$('gate');g.hidden=false;
  g.innerHTML='<div class="sheet" style="border-radius:18px;max-width:440px;margin:auto"><h2>Acesso desativado</h2><p class="muted">A licença de <b>'+esc(pl.n)+'</b> foi desativada. Seus dados continuam guardados neste aparelho: copie um backup antes de sair.</p><label class="f">Backup<textarea class="in" id="rev-bk" rows="5" readonly>'+esc(JSON.stringify(S))+'</textarea></label><div class="stack"><button class="btn full" data-a="rev-backup">Copiar meu backup</button><button class="btn sec full" data-a="rev-other">Usar outro código</button></div><p class="small muted">'+(cfg.support?'Dúvidas: '+esc(cfg.support):'')+'</p></div>';
}
FORMS.gate=function(f){
  var code=String(new FormData(f).get('code')||'').replace(/\s+/g,''),msg=$('gate-msg');msg.textContent='Verificando…';
  checkLicense(code).then(function(r){
    if(r.ok){try{localStorage.setItem('meiapp:lic',code)}catch(e){}LIC=r.pl;$('gate').hidden=true;$('gate').innerHTML='';start()}
    else if(r.why==='revogada')msg.textContent='Esta licença foi desativada. Fale com o suporte.';
    else if(r.why==='semsuporte')msg.textContent='Este navegador não consegue verificar o código. Abra o link no Chrome ou no Safari atualizado.';
    else msg.textContent='Código inválido. Confira se copiou o código inteiro, sem cortar nada.';
  });
};
A['gate-paste']=function(){try{navigator.clipboard.readText().then(function(t){var a=document.querySelector('#gate textarea');if(a)a.value=t}).catch(function(){toast('Não foi possível colar sozinho. Cole manualmente no campo.')})}catch(e){toast('Cole manualmente no campo.')}};
A['rev-backup']=function(){var t=$('rev-bk');t.focus();t.select();try{document.execCommand('copy');toast('Backup copiado.')}catch(e){toast('Selecione o texto e copie.')}};
A['rev-other']=function(){try{localStorage.removeItem('meiapp:lic')}catch(e){}showGate()};
function start(){
  S=load();var first=false;
  if(!S){S=blank();first=true}
  if(LIC)S.licId=LIC.id;
  applyTheme();render();
  if(S.pin)showLock();
  else if(first||(!S.welcomed&&!S.lanc.length&&!S.servicos.length&&!S.clientes.length))openWelcome();
}
function gateInit(){
  applyTheme();
  var cfg=window.MEI_LICENSE;
  if(!cfg||!cfg.required){start();return}
  var code='';try{code=localStorage.getItem('meiapp:lic')||''}catch(e){}
  if(!code){showGate();return}
  checkLicense(code).then(function(r){
    if(r.ok){LIC=r.pl;start()}
    else if(r.why==='revogada')showRevoked(r.pl);
    else showGate(r.why==='semsuporte'?'Este navegador não consegue verificar o código.':'Seu código não é válido. Peça um novo ao vendedor.');
  });
}
gateInit();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller){var b=document.createElement('div');b.className='toast';b.style.bottom='calc(90px + env(safe-area-inset-bottom,0px))';b.innerHTML='Nova versão disponível. <button class="tbtn" id="upd">Atualizar</button>';document.body.appendChild(b);document.getElementById('upd').onclick=function(){location.reload()}}})});
    }).catch(function(){});
  });
}
})();
